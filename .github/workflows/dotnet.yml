name: Build .NET MAUI App Android

on:
  push:
    branches: [ "working_branch" ]
  pull_request:
    branches: [ "working_branch" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup Keystore File
        run:
          echo "${{ secrets.KEYSTORE_FILE }}" > myapp.keystore
      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 8.0.x
      - name: Install .NET MAUI
        run: dotnet workload install maui
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build AcademicAssistant/AcademicAssistant.csproj -c:Release -f net8.0-android /p:AndroidSigningKeyStore=myapp.keystore /p:AndroidSigningKeyAlias=ghactionskey /p:AndroidSigningKeyPass="${{ secrets.KEYSTORE_PASSWORD }}" /p:AndroidSigningStorePass="${{ secrets.KEYSTORE_PASSWORD_ALIAS }}" --no-restore # may need to correct to -c Release
      - name: Upload a Build Artifact # Uploading a build artifact to the action run. I might want to do something different.
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            ./**/*.aab
            ./**/*.apk
